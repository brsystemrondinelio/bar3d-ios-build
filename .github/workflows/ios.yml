# Compila o Bar 3D para iPhone num Mac do GitHub e envia ao TestFlight.
# O jogo NAO esta neste repositorio: o pacote e baixado do nosso servidor com uma
# chave guardada nos Segredos. So dispara sob pedido (workflow_dispatch).
name: Bar 3D iPhone

on:
  workflow_dispatch:
    inputs:
      pacote:
        description: "Arquivo do pacote no servidor (ex.: bar3d_ios_1.12_2.tar.gz)"
        required: true
        default: "bar3d_ios_1.12_2.tar.gz"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.r7games.virtual3dcasino
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - name: Xcode mais novo instalado
        run: |
          ls -d /Applications/Xcode*.app
          NOVO=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NOVO/Contents/Developer"
          xcodebuild -version

      - name: Ferramentas de assinatura e envio
        run: |
          python3 -m venv "$HOME/cm"
          "$HOME/cm/bin/pip" install --quiet codemagic-cli-tools
          echo "$HOME/cm/bin" >> "$GITHUB_PATH"

      - name: Baixar o projeto Xcode do servidor
        env:
          CHAVE_BUILD: ${{ secrets.CHAVE_BUILD }}
          PACOTE: ${{ inputs.pacote }}
        run: |
          set -e
          curl -fsSL --retry 3 -H "X-Chave-Build: $CHAVE_BUILD" \
            -o projeto.tar.gz "https://jogosonline.top/_build/bar3d-ios/$PACOTE"
          mkdir projeto && tar -xzf projeto.tar.gz -C projeto
          ls projeto

      - name: SDK de anuncios (AdMob) como pacote Swift
        # O Godot no Windows nao consegue anexar o pacote (precisa de Ruby + xcodeproj, so no Mac).
        # Aqui o Mac anexa o Google Mobile Ads ao projeto antes de compilar.
        run: |
          set -e
          sudo gem install xcodeproj --no-document
          cat > add_dep.rb <<'RB'
          require 'xcodeproj'
          caminho, url, versao, produto = ARGV
          proj = Xcodeproj::Project.open(caminho)
          alvo = proj.targets.first
          if alvo.package_product_dependencies.any? { |d| d.product_name == produto }
            puts "ja existe: #{produto}"
          else
            pkg = proj.root_object.package_references.find { |p| p.repositoryURL == url }
            if pkg.nil?
              pkg = proj.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
              pkg.repositoryURL = url
              pkg.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => versao }
              proj.root_object.package_references << pkg
            end
            ref = proj.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            ref.product_name = produto
            ref.package = pkg
            alvo.package_product_dependencies << ref
            puts "adicionado: #{produto}"
          end
          proj.save
          RB
          sed -i 's/^          //' add_dep.rb
          ruby add_dep.rb projeto/Bar3D.xcodeproj https://github.com/googleads/swift-package-manager-google-mobile-ads.git 12.14.0 GoogleMobileAds
          cd projeto && xcodebuild -resolvePackageDependencies -project Bar3D.xcodeproj -scheme Bar3D

      - name: Assinatura (certificado e perfil na Apple)
        run: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          cd projeto && xcode-project use-profiles

      - name: Compilar o .ipa
        run: |
          cd projeto
          xcode-project build-ipa --project Bar3D.xcodeproj --scheme Bar3D

      - name: Enviar ao TestFlight
        run: |
          app-store-connect publish --path "projeto/build/ios/ipa/Bar3D.ipa"
